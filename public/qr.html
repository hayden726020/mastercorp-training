<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code — Mastercorp Training</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; gap: 2rem;
      background: #f5f5f5; color: #1a1a1a;
      padding: 2rem;
    }
    .card {
      background: white; border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem; text-align: center;
      max-width: 480px; width: 100%;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
    p.url {
      font-size: 0.875rem; color: #666;
      word-break: break-all; margin-bottom: 1.5rem;
    }
    img { width: 100%; max-width: 360px; height: auto; border-radius: 8px; }
    .meta {
      margin-top: 1.25rem;
      font-size: 0.75rem; color: #999;
    }
    button {
      margin-top: 1rem; padding: 0.6rem 1.5rem;
      font-size: 0.875rem; font-weight: 500;
      border: none; border-radius: 8px;
      background: #1A5F7A; color: white; cursor: pointer;
    }
    button:hover { background: #144c63; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Mastercorp — Housekeeper Training</h1>
    <p class="url">https://mastercorp-training.pages.dev</p>
    <img src="qr-code.png" alt="QR Code for Mastercorp Training" />
    <p class="meta">Scan with your phone camera to access the training portal</p>
  </div>
  <p style="font-size:0.75rem;color:#aaa;">Wilderness Club at Big Cedar &copy; 2026</p>
</body>
</html>
