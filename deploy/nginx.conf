# ============================================================
# Nginx Configuration — Housekeeper Training System
# ============================================================
# Target: Tencent Cloud Ubuntu 22.04
# Role:   Reverse proxy to Next.js (localhost:3000)
#
# Placement:
#   /etc/nginx/sites-available/housekeeper-training
#   → symlink to /etc/nginx/sites-enabled/
#
# Test:   nginx -t
# Reload: systemctl reload nginx
# ============================================================

upstream nextjs_backend {
    # Next.js server (PM2-managed on localhost:3000)
    server 127.0.0.1:3000;

    # Enable keepalive connections (reduces latency)
    keepalive 64;
}

# ── HTTP → HTTPS redirect ─────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your domain, e.g. training.example.com

    # Let's Encrypt ACME challenge (if using Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ──────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _; # Replace with your domain

    # ── SSL certificates (Certbot / Let's Encrypt) ────
    # Uncomment after running certbot:
    # ssl_certificate     /etc/letsencrypt/live/your-domain/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain/privkey.pem;
    #
    # For self-signed or initial setup without HTTPS, comment out the
    # entire HTTPS server block and use HTTP-only temporarily.

    # ── SSL settings ──────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Security headers ──────────────────────────────
    # CSP: Adjust based on your needs. 'unsafe-inline' for styles is needed
    # by Tailwind CSS in development; remove in production if using full CSS extraction.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip compression ──────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    # ── Static file caching ───────────────────────────
    # Next.js static assets (JS, CSS, fonts, images)
    location /_next/static {
        alias /opt/housekeeper-training/.next/static;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public assets (favicon, robots.txt, etc.)
    location /public {
        alias /opt/housekeeper-training/public;
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Image assets
    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Font assets
    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        add_header Access-Control-Allow-Origin *;
    }

    # ── Main proxy to Next.js ─────────────────────────
    location / {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;

        # WebSocket support (Next.js HMR in dev, future real-time features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward original request info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        # Disable nginx's own caching — Next.js handles it
        proxy_cache_bypass $http_upgrade;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── Deny hidden files ─────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Logs ──────────────────────────────────────────
    access_log /var/log/nginx/housekeeper-training-access.log;
    error_log /var/log/nginx/housekeeper-training-error.log;
}
